[package]
name = "dim"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "dim - Disk Image Mounter: minimal disc image mounter for Windows"
authors = ["Glauber Lima"]
license = "MIT"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Storage_Vhd",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_SystemServices",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-dependencies]
embed-resource = "3"
