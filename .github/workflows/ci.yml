name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Size guard (the app is meant to stay tiny)
        run: |
          size=$(stat -c %s target/release/dim.exe)
          echo "dim.exe: $size bytes"
          [ "$size" -lt 614400 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dim-windows-x64
          path: target/release/dim.exe
          if-no-files-found: error
